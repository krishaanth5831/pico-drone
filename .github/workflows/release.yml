name: Release

# "Deploy" for a Pico means producing the exact set of files you copy onto the
# board's filesystem. Tagging a version bundles them and attaches the zip to a
# GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  bundle:
    name: Build flashable bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify it compiles before shipping it
        run: |
          python -m compileall -q src
          # compileall leaves __pycache__ behind, and those are CPython
          # bytecode - the wrong format for MicroPython and pure waste on the
          # Pico's flash. Clear them before anything gets copied.
          find src -name __pycache__ -type d -exec rm -rf {} + 2>/dev/null || true

      - name: Assemble firmware bundle
        run: |
          # On workflow_dispatch, GITHUB_REF_NAME is the *branch*, not a tag, so
          # the explicit input has to win. Resolved by GitHub before the shell
          # ever sees it.
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          echo "building $VERSION"

          mkdir -p dist/pico-drone
          # Flat layout: these land at the board's filesystem root, which is what
          # `sys.path.append("/")` in main.py expects. src/__init__.py is only
          # there so local tooling can treat src/ as a package - it has no
          # meaning at the board root, so it is left out.
          cp src/main.py src/config.py dist/pico-drone/
          cp -r src/drivers src/flight dist/pico-drone/
          find dist -name __pycache__ -type d -exec rm -rf {} + 2>/dev/null || true
          find dist -name '*.pyc' -delete
          cp README.md LICENSE dist/pico-drone/
          echo "$VERSION" > dist/pico-drone/VERSION

          cd dist && zip -qr "pico-drone-${VERSION}.zip" pico-drone
          echo "BUNDLE=dist/pico-drone-${VERSION}.zip" >> "$GITHUB_ENV"
          echo "--- bundle contents ---"
          unzip -l "pico-drone-${VERSION}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: pico-drone-bundle
          path: ${{ env.BUNDLE }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.BUNDLE }}
          generate_release_notes: true
          body: |
            ## Flashing

            1. Download and unzip the bundle below.
            2. Copy everything inside `pico-drone/` to the **root** of the Pico's
               filesystem (Thonny: select the files, right-click, "Upload to /").
            3. Reset the board. `main.py` runs automatically.

            Motors stay hardware-disarmed at boot. See `README.md`.
