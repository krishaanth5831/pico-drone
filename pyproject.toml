[project]
name = "pico-drone"
version = "0.1.0"
description = "Coreless quadcopter flight controller on a Raspberry Pi Pico 2 W"
requires-python = ">=3.10"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/mocks"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
# testing/ scripts are pasted into Thonny and run standalone on the board, so
# they deliberately use MicroPython-only builtins and star-ish import patterns.
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # line length is handled by the formatter
    "UP032",   # .format() vs f-string: MicroPython prefers % anyway
    "UP031",   # % formatting is idiomatic and cheap on MicroPython
]

[tool.ruff.lint.per-file-ignores]
# Board scripts import `machine` at module scope after a sys.path tweak, and
# print rather than log. Both are correct there.
#
# B904 wants `raise ... from None` inside an except block. MicroPython's support
# for exception-chaining syntax varies between builds, and a SyntaxError on the
# board would be a much worse failure than a chained traceback - especially in
# the ImportError guards, whose whole job is to produce a readable message.
"testing/**/*.py" = ["E402", "T201", "B904"]
"src/main.py" = ["E402"]
"tests/**/*.py" = ["SLF001"]  # tests reach into private attrs on purpose
# SIM105 wants contextlib.suppress(), which MicroPython does not ship - the
# firmware has no contextlib at all, so try/except/pass is the only option.
"src/drivers/heartbeat.py" = ["SIM105"]
# Same rationale as the testing/ exemption above: MicroPython's exception-
# chaining syntax support varies by build, and the ImportError guard's entire
# job is producing a readable message, not a chained traceback.
"firmware/*.py" = ["E402", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["config", "drivers", "flight", "tuning"]
